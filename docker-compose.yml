version: '3.8'

services:
  web:
    build: .
    command: gunicorn -b 0.0.0.0:5000 wsgi:app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=localvortex
      - POSTGRES_PASSWORD=localvortex
      - POSTGRES_DB=localvortex_dev

volumes:
  postgres_data:
